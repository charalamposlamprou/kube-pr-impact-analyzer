name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.0'
          cache: false
      - run: scripts/install-tools.sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make check
        env:
          REQUIRE_RENDER_TOOLS: '1'
      - run: make kind-test
      - run: docker build --tag kube-impact:ci .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
