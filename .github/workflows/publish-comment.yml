name: Publish Kubernetes report
on:
  workflow_run:
    workflows: [PR Kubernetes analysis]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
# Serialization prevents two check-then-create publishers from creating duplicates.
concurrency:
  group: kube-impact-comment-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # workflow_run uses the default branch. Never checkout the triggering PR here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.0'
          cache: false
      - name: Build trusted publisher before exposing token
        run: go build -trimpath -o bin/kube-impact ./cmd/kube-impact
      - name: Validate provenance and artifact; update one bot comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ANALYSIS_RUN_ID: ${{ github.event.workflow_run.id }}
        run: bin/kube-impact publish --repo "$REPOSITORY" --run-id "$ANALYSIS_RUN_ID" --timeout 3m
